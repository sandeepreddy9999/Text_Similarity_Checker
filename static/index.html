<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Similarity Checker</title>
<style>
  :root {
    --bg:#f4f5fb; --card:#ffffff; --text:#1a1d29; --muted:#6b7280; --border:#e4e6ef;
    --accent:#4f46e5; --accent2:#7c3aed; --input:#f9fafc;
    --c-high:#16a34a; --c-mid:#2563eb; --c-low:#d97706; --c-none:#9ca3af;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1117; --card:#181b24; --text:#e8eaf0; --muted:#98a0ae; --border:#2a2e3b;
      --accent:#818cf8; --accent2:#a78bfa; --input:#11141b;
      --c-high:#4ade80; --c-mid:#60a5fa; --c-low:#fbbf24; --c-none:#6b7280;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  header { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:40px 16px 72px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:clamp(1.6rem,4vw,2.2rem); letter-spacing:-.02em; }
  header p { margin:0 auto; max-width:520px; opacity:.9; }
  main { max-width:780px; margin:-44px auto 0; padding:0 16px 40px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .tabs { display:flex; gap:4px; padding:4px; background:var(--input); border:1px solid var(--border); border-radius:12px; margin-bottom:18px; }
  .tabs button { flex:1; padding:10px; border:0; background:transparent; color:var(--muted); border-radius:9px; cursor:pointer; font:inherit; font-weight:600; transition:.15s; }
  .tabs button.active { background:var(--card); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .field { margin-bottom:14px; }
  .field-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  label { font-size:.85rem; font-weight:600; }
  .count { font-size:.75rem; color:var(--muted); }
  textarea { width:100%; min-height:110px; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--input); color:var(--text); font:inherit; resize:vertical; transition:.15s; }
  textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent); }
  .hint { font-size:.8rem; color:var(--muted); margin-top:4px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .controls .grow { flex:1; min-width:200px; }
  select { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--input); color:var(--text); font:inherit; }
  .go { padding:11px 26px; border:0; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font:inherit; font-weight:600; cursor:pointer; transition:.15s; }
  .go:hover { filter:brightness(1.08); }
  .go:disabled { opacity:.6; cursor:wait; }
  .ghost { padding:11px 14px; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--muted); font:inherit; cursor:pointer; }
  .ghost:hover { color:var(--text); border-color:var(--muted); }
  .err { color:#dc2626; margin-top:12px; font-size:.9rem; }
  .err:empty { display:none; }
  .hidden { display:none; }

  .bar { height:10px; background:var(--border); border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:0; border-radius:99px; background:var(--accent); transition:width .5s ease; }
  .tone-high { --tone:var(--c-high); } .tone-mid { --tone:var(--c-mid); }
  .tone-low { --tone:var(--c-low); } .tone-none { --tone:var(--c-none); }
  .bar > div, .badge { background:var(--tone, var(--accent)); }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; color:#fff; font-size:.75rem; font-weight:600; }
  .tone-none .badge { color:#fff; }

  .result-single { text-align:center; padding:8px 0; }
  .score { font-size:3.2rem; font-weight:800; letter-spacing:-.03em; line-height:1.1; color:var(--tone); }
  .result-single .bar { max-width:420px; margin:14px auto 0; height:12px; }
  .result-single .badge { margin-top:8px; font-size:.85rem; padding:3px 14px; }
  .result-title { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }

  .row { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }
  .row:first-child { padding-top:0; }
  .row:last-child { border-bottom:0; padding-bottom:0; }
  .rank { flex:0 0 30px; height:30px; border-radius:50%; background:var(--input); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; color:var(--muted); }
  .row:first-child .rank { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row-body { flex:1; min-width:0; }
  .row-top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .row-top strong { font-size:1.05rem; }
  .row-text { margin-top:8px; word-break:break-word; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:0 16px 32px; }
  @media (max-width:520px) { .go, .ghost { flex:1; } }
</style>
</head>
<body>
<header>
  <h1>Text Similarity Checker</h1>
  <p>Compare two texts, or rank a list of documents against a query, using word overlap or meaning.</p>
</header>

<main>
  <div class="card">
    <div class="tabs">
      <button id="tab-compare" class="active">Compare two texts</button>
      <button id="tab-rank">Rank documents</button>
    </div>

    <div id="compare-form">
      <div class="field">
        <div class="field-head"><label for="t1">Text 1</label><span class="count" id="c-t1">0 chars</span></div>
        <textarea id="t1" placeholder="Paste or type the first text..."></textarea>
      </div>
      <div class="field">
        <div class="field-head"><label for="t2">Text 2</label><span class="count" id="c-t2">0 chars</span></div>
        <textarea id="t2" placeholder="Paste or type the second text..."></textarea>
      </div>
    </div>

    <div id="rank-form" class="hidden">
      <div class="field">
        <div class="field-head"><label for="q">Query</label></div>
        <textarea id="q" style="min-height:64px" placeholder="What are you looking for?"></textarea>
      </div>
      <div class="field">
        <div class="field-head"><label for="docs">Documents</label><span class="count" id="c-docs">0 documents</span></div>
        <textarea id="docs" placeholder="One document per line..."></textarea>
        <div class="hint">Up to 100 documents, one per line.</div>
      </div>
    </div>

    <div class="controls">
      <div class="grow">
        <label for="method" style="display:block;margin-bottom:6px">Method</label>
        <select id="method">
          <option value="tfidf">TF-IDF (word overlap)</option>
          <option value="semantic">Semantic (meaning)</option>
        </select>
      </div>
      <button class="ghost" id="example" type="button">Try an example</button>
      <button class="go" id="go" type="button">Check</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card hidden" id="result"></div>
</main>

<footer>TF-IDF works out of the box. Semantic mode needs <code>sentence-transformers</code> installed.</footer>

<script>
const $ = id => document.getElementById(id);
let mode = "compare";

const EXAMPLES = {
  compare: { t1: "I love learning Python programming", t2: "Studying Python code is something I really enjoy" },
  rank: {
    q: "learn python programming",
    docs: "Best pizza recipes\nPython programming tutorial for beginners\nGardening tips for spring\nIntroduction to coding with Python",
  },
};

function setMode(m) {
  mode = m;
  $("tab-compare").classList.toggle("active", m === "compare");
  $("tab-rank").classList.toggle("active", m === "rank");
  $("compare-form").classList.toggle("hidden", m !== "compare");
  $("rank-form").classList.toggle("hidden", m !== "rank");
  $("result").classList.add("hidden");
  $("err").textContent = "";
}
$("tab-compare").onclick = () => setMode("compare");
$("tab-rank").onclick = () => setMode("rank");

const pct = s => (s * 100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const tone = s => s >= 0.85 ? "high" : s >= 0.6 ? "mid" : s >= 0.3 ? "low" : "none";
const docList = () => $("docs").value.split("\n").map(s => s.trim()).filter(Boolean);

function updateCounts() {
  $("c-t1").textContent = $("t1").value.length + " chars";
  $("c-t2").textContent = $("t2").value.length + " chars";
  const n = docList().length;
  $("c-docs").textContent = n + (n === 1 ? " document" : " documents");
}
["t1", "t2", "docs"].forEach(id => $(id).addEventListener("input", updateCounts));

$("example").onclick = () => {
  const e = EXAMPLES[mode];
  if (mode === "compare") { $("t1").value = e.t1; $("t2").value = e.t2; }
  else { $("q").value = e.q; $("docs").value = e.docs; }
  updateCounts();
};

async function post(url, body) {
  const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Please fill in all fields.");
  return data;
}

function animateBars() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll("#result .bar > div").forEach(b => b.style.width = b.dataset.w + "%");
  }));
}

$("go").onclick = async () => {
  $("err").textContent = "";
  $("go").disabled = true;
  const method = $("method").value;
  try {
    if (mode === "compare") {
      const d = await post("/api/compare", { text1:$("t1").value.trim(), text2:$("t2").value.trim(), method });
      $("result").innerHTML = `<div class="result-single tone-${tone(d.score)}">
        <div class="result-title">Similarity</div>
        <div class="score">${pct(d.score)}</div>
        <span class="badge">${esc(d.label)}</span>
        <div class="bar"><div data-w="${d.score * 100}"></div></div></div>`;
    } else {
      const d = await post("/api/rank", { query:$("q").value.trim(), documents:docList(), method });
      $("result").innerHTML = d.results.map((r, i) => `<div class="row tone-${tone(r.score)}">
        <div class="rank">${i + 1}</div>
        <div class="row-body">
          <div class="row-top"><strong>${pct(r.score)}</strong><span class="badge">${esc(r.label)}</span></div>
          <div class="bar"><div data-w="${r.score * 100}"></div></div>
          <div class="row-text">${esc(r.text)}</div>
        </div></div>`).join("");
    }
    $("result").classList.remove("hidden");
    animateBars();
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
